<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>양손 벌리기 챌린지</title>
  <link rel="stylesheet" href="style.css?v=db3af861" />
</head>
<body>
  <div class="container">
    <header>
      <h1>양손 벌리기 챌린지</h1>
      <p class="subtitle">카운트다운 후 찰칵! — 양손 벌리면 GOOD, 한발로 서면 EXCELLENT</p>
    </header>

    <!-- Video stage -->
    <div class="stage">

      <!-- LEFT: Camera -->
      <div class="video-wrapper">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>

        <div class="cd-overlay" id="cd-overlay">
          <div class="cd-ring" id="cd-ring"></div>
          <div class="cd-number" id="cd-number"></div>
        </div>

        <div class="snap-overlay" id="snap-overlay">
          <span class="snap-text">찰칵!</span>
        </div>

        <div class="flash-overlay" id="flash-overlay"></div>

        <!-- Zoom controls -->
        <div class="zoom-controls">
          <button class="zoom-btn" id="zoom-out">−</button>
          <span class="zoom-val" id="zoom-val">1.0x</span>
          <button class="zoom-btn" id="zoom-in">+</button>
        </div>
      </div>

      <!-- RIGHT: Control panel -->
      <div class="right-panel">

        <!-- State: IDLE -->
        <div id="state-idle" class="panel-card">
          <img src="mascots/kkomi.png" alt="꼬미" style="width:88px;object-fit:contain;" />
          <p class="panel-title">양손 벌리기 챌린지</p>
          <p class="instruction">카운트다운이 끝나는 순간<br>양손을 좌우로 활짝 벌리세요!<br><span class="instruction-sub">한발로 서면 EXCELLENT!</span></p>
          <button class="primary-btn" id="start-btn">시작하기 →</button>
        </div>

        <!-- State: COUNTDOWN -->
        <div id="state-countdown" style="display:none" class="panel-card">
          <img src="mascots/tobi.png" alt="토비" style="width:72px;object-fit:contain;animation:bob 0.6s ease-in-out infinite alternate;" />
          <p class="countdown-hint">양손을 활짝 벌리고<br>한발로 서보세요!</p>
        </div>

        <!-- State: RESULT -->
        <div id="state-result" style="display:none" class="panel-card">
          <img id="snap-preview" class="snap-preview" alt="찰칵 순간" />
          <div class="result-icon" id="result-icon"></div>
          <div class="result-label" id="result-label"></div>
          <div class="result-conditions">
            <div class="cond-item" id="cond-arms">
              <span class="cond-icon" id="cond-arms-icon"></span>
              <span class="cond-text">양손 벌리기</span>
            </div>
            <div class="cond-item" id="cond-balance">
              <span class="cond-icon" id="cond-balance-icon"></span>
              <span class="cond-text">한발 서기</span>
            </div>
          </div>
          <div class="result-sub" id="result-sub"></div>
          <button class="primary-btn retry-btn" id="retry-btn">다시하기</button>
        </div>

        <!-- Stats -->
        <div class="stats-grid-right">
          <div class="stat-block">
            <div class="stat-label">시도</div>
            <div class="stat-val" id="total-tries">0</div>
          </div>
          <div class="stat-block ok-block">
            <div class="stat-label">정답</div>
            <div class="stat-val" id="total-correct">0</div>
          </div>
          <div class="stat-block fail-block">
            <div class="stat-label">실패</div>
            <div class="stat-val" id="total-wrong">0</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">FPS</div>
            <div class="stat-val" id="fps-value">-</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">자세</div>
            <div class="stat-val" id="pose-detected">-</div>
          </div>
          <div class="stat-block">
            <div class="stat-label">팔</div>
            <div class="stat-val" id="arm-status">-</div>
          </div>
        </div>

      </div><!-- /right-panel -->
    </div><!-- /stage -->

    <!-- Debug panel -->
    <div class="debug-section">
      <button class="debug-toggle" id="debug-toggle">디버그 패널 열기</button>
      <div class="debug-panel" id="debug-panel" style="display:none">
        <div class="debug-metrics">
          <div class="debug-metric">
            <div class="dm-label">팔 벌림 비율</div>
            <div class="dm-value" id="db-span-ratio">-</div>
          </div>
          <div class="debug-metric">
            <div class="dm-label">왼손 높이</div>
            <div class="dm-value" id="db-arm-left">-</div>
          </div>
          <div class="debug-metric">
            <div class="dm-label">오른손 높이</div>
            <div class="dm-value" id="db-arm-right">-</div>
          </div>
          <div class="debug-metric">
            <div class="dm-label">한발 서기</div>
            <div class="dm-value" id="db-one-foot">-</div>
          </div>
          <div class="debug-metric">
            <div class="dm-label">발목 차이</div>
            <div class="dm-value" id="db-ankle-diff">-</div>
          </div>
        </div>
        <div class="debug-log-wrap">
          <div class="debug-log-header">
            <span>이벤트 로그</span>
            <div class="debug-log-actions">
              <button id="debug-clear">지우기</button>
              <button id="debug-download">JSON 다운로드</button>
            </div>
          </div>
          <div class="debug-log-list" id="debug-log-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" id="loading-overlay">
    <img src="mascots/kkomi.png" alt="" class="loading-mascot" />
    <div class="loading-text">도토리가 준비하고 있어요...</div>
    <div class="loading-sub">처음 로드 시 시간이 걸릴 수 있어요</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="app.js?v=8aea1a1a"></script>
</body>
</html>
